name: Weather check-in (daily)

# Automatic morning check-in on the daily-temperature markets that settled overnight:
# the scorecard (per-book PnL + decision table, incl. the weather_pm cross-market book)
# AND the research experiments digest (model check / exit sweep / entry study). Runs on
# a schedule and can be triggered manually. Reads a SELECT-only Postgres URL from the
# DATABASE_URL_RO secret.

on:
  schedule:
    # 14:00 UTC ~= morning ET, after the overnight NWS Daily Climate Reports settle.
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Run weather check-in
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_RO }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_RO secret is not set — add a read-only Postgres URL (see docs/REMOTE_ACCESS.md)."
            exit 1
          fi
          # tee so everything lands in BOTH the run summary (human-readable web page)
          # and the job's console log (which the GitHub API/tools can fetch).
          {
            echo '## Weather scorecard (PnL + forecast accuracy + consistency)'
            echo '```'
            python scripts/weather_score.py
            echo '```'
            echo '## Experiments digest (model check / exit sweep / entry study)'
            echo '```'
            python scripts/weather_experiments.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

