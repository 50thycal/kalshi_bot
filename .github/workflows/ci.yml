name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kalshi
          POSTGRES_PASSWORD: kalshi
          POSTGRES_DB: kalshi_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kalshi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Used by `alembic upgrade head` to exercise the migration on real Postgres.
      DATABASE_URL: postgresql://kalshi:kalshi@localhost:5432/kalshi_bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Apply migrations on Postgres
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
